<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMXL BUYER - Create Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(255, 107, 0, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 50%, rgba(255, 107, 0, 0.05) 0%, transparent 60%);
            animation: rotateGlow 20s linear infinite;
            z-index: 0;
        }
        @keyframes rotateGlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .wrapper { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 20px; }
        .card {
            background: rgba(16, 16, 16, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 107, 0, 0.25);
            border-radius: 32px;
            padding: 48px 40px 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 60px rgba(255, 107, 0, 0.05);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card:hover { transform: translateY(-4px) scale(1.01); }
        .logo-area { text-align: center; margin-bottom: 28px; }
        .logo-icon {
            font-size: 48px;
            color: #ff6b00;
            display: inline-block;
            background: rgba(255, 107, 0, 0.12);
            padding: 18px;
            border-radius: 24px;
            margin-bottom: 12px;
            box-shadow: 0 0 40px rgba(255, 107, 0, 0.1);
        }
        .logo-area h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b00, #ff8c38);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        .logo-area .subtitle {
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .info-box {
            background: rgba(255, 107, 0, 0.06);
            border: 1px solid rgba(255, 107, 0, 0.08);
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 24px;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            line-height: 1.6;
        }
        .info-box i { color: #ff6b00; margin-right: 6px; }
        .input-group { position: relative; margin-bottom: 14px; }
        .input-group .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 16px;
            transition: color 0.3s ease;
            pointer-events: none;
        }
        .input-group input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .input-group input::placeholder { color: rgba(255, 255, 255, 0.15); font-weight: 400; }
        .input-group input:focus {
            border-color: #ff6b00;
            background: rgba(255, 107, 0, 0.05);
            box-shadow: 0 0 30px rgba(255, 107, 0, 0.05);
        }
        .input-group input:focus~.input-icon { color: #ff6b00; }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff6b00, #e65c00);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 8px 40px rgba(255, 107, 0, 0.3); }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary .btn-icon { margin-right: 8px; }
        .btn-danger {
            width: 100%;
            padding: 12px;
            background: rgba(255, 68, 68, 0.08);
            border: 1px solid rgba(255, 68, 68, 0.12);
            color: #ff4444;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
        }
        .btn-danger:hover { background: rgba(255, 68, 68, 0.15); border-color: rgba(255, 68, 68, 0.25); }
        .msg {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            margin-top: 12px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .msg.show { display: flex; }
        .msg.error { background: rgba(255, 68, 68, 0.08); border: 1px solid rgba(255, 68, 68, 0.12); color: #ff4444; }
        .msg.success { background: rgba(0, 200, 83, 0.08); border: 1px solid rgba(0, 200, 83, 0.12); color: #00c853; }
        .msg.warning { background: rgba(255, 193, 7, 0.08); border: 1px solid rgba(255, 193, 7, 0.12); color: #ffc107; }
        .footer { text-align: center; margin-top: 20px; color: rgba(255, 255, 255, 0.12); font-size: 11px; letter-spacing: 1px; }
        .footer span { color: #ff6b00; font-weight: 600; }
        .footer .note { color: rgba(255, 255, 255, 0.08); font-size: 10px; margin-top: 6px; line-height: 1.6; }
        .login-link { text-align: center; margin-top: 14px; font-size: 13px; color: rgba(255, 255, 255, 0.2); }
        .login-link a { color: #ff6b00; text-decoration: none; font-weight: 600; }
        .login-link a:hover { text-decoration: underline; }
        @media (max-width: 480px) {
            .card { padding: 32px 20px 28px; border-radius: 24px; }
            .logo-area h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <div class="logo-area">
                <div class="logo-icon"><i class="fas fa-user-plus"></i></div>
                <h1>SMXL BUYER</h1>
                <div class="subtitle">Create Account</div>
            </div>

            <div class="info-box">
                <i class="fas fa-info-circle"></i>
                Buat akun untuk login di SMXL.
                <br>
                <i class="fas fa-exclamation-triangle" style="color:#ffc107;"></i>
                Maksimal 1 akun per device.
            </div>

            <form id="registerForm" autocomplete="off">
                <div class="input-group">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="regUsername" placeholder="Buat Username" required />
                </div>
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="regPassword" placeholder="Buat Password" required />
                </div>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-user-plus btn-icon"></i> CREATE
                </button>
                <div class="msg" id="regMsg"></div>
            </form>

            <button class="btn-danger" id="deleteBtn">
                <i class="fas fa-trash-alt"></i> Delete Account
            </button>
            <div class="msg" id="deleteMsg"></div>

            <div class="login-link">
                Sudah punya akun? <a href="https://samillll.github.io/SMXL/" target="_blank">Login di sini</a>
            </div>

            <div class="footer">
                <i class="fas fa-code"></i> created by <span>SAMIL</span>
                <div class="note">
                    <i class="fas fa-info-circle"></i> Maksimal 1 akun per device.<br />
                    Username & password bersifat pribadi, jangan disebar.<br />
                    Jika disebarkan, akun & buyer akan diblokir.
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // KONFIGURASI — GANTI DENGAN PUNYA LO!
        // ============================================================

        // 1. BIN ID — dari JSONBin.io (contoh: 64f3a1b2e4b0d1c2a3b4c5d6)
        const BIN_ID = '6a996f64da38895dfe33dd2d';

        // 2. API KEY — dari JSONBin.io (contoh: $2a$10$ABC123...)
        const API_KEY = '$2a$10$8qTaNsbZqbnutP413H87y.mP1yzZyY8tfHHzrCWn4PTkWdIOaGBfO';

        // 3. URL API
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        // ============================================================
        // REFS
        // ============================================================
        const registerForm = document.getElementById('registerForm');
        const regMsg = document.getElementById('regMsg');
        const deleteMsg = document.getElementById('deleteMsg');

        // ============================================================
        // FETCH DATA
        // ============================================================
        async function fetchAccounts() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error('Gagal fetch data');
                const data = await res.json();
                return data.record.accounts || {};
            } catch (e) {
                console.warn('Gagal load data:', e);
                return {};
            }
        }

        // ============================================================
        // UPDATE DATA
        // ============================================================
        async function updateGist(accounts) {
            const payload = { accounts };

            const res = await fetch(API_URL, {
                method: 'PUT',
                headers: {
                    'X-Master-Key': API_KEY,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.message || 'Gagal update data');
            }

            return true;
        }

        // ============================================================
        // GET DEVICE ID
        // ============================================================
        function getDeviceId() {
            let id = localStorage.getItem('smxl_device_id');
            if (!id) {
                id = 'DEV_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 6);
                localStorage.setItem('smxl_device_id', id);
            }
            return id;
        }

        // ============================================================
        // REGISTER
        // ============================================================
        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            regMsg.classList.remove('show');

            if (!username || !password) {
                showMsg(regMsg, '❌ Username & Password harus diisi!', 'error');
                return;
            }

            if (username.length < 3) {
                showMsg(regMsg, '❌ Username minimal 3 karakter!', 'error');
                return;
            }

            if (password.length < 4) {
                showMsg(regMsg, '❌ Password minimal 4 karakter!', 'error');
                return;
            }

            const deviceId = getDeviceId();
            const accounts = await fetchAccounts();

            // Cek apakah device sudah punya akun
            for (const key in accounts) {
                if (accounts[key].deviceId === deviceId) {
                    showMsg(regMsg, '❌ Device ini sudah punya akun! Maksimal 1 akun.', 'error');
                    return;
                }
            }

            // Cek username sudah dipakai
            if (accounts[username]) {
                showMsg(regMsg, '❌ Username sudah terdaftar!', 'error');
                return;
            }

            // Simpan akun
            accounts[username] = {
                password: password,
                deviceId: deviceId,
                role: 'Member',
                exp: '0',
                createdAt: new Date().toISOString()
            };

            try {
                await updateGist(accounts);
                showMsg(regMsg, '✅ Akun berhasil dibuat! Silahkan login di SMXL.', 'success');
                document.getElementById('regUsername').value = '';
                document.getElementById('regPassword').value = '';
            } catch (err) {
                showMsg(regMsg, '❌ Gagal menyimpan akun: ' + err.message, 'error');
            }
        });

        // ============================================================
        // DELETE ACCOUNT
        // ============================================================
        document.getElementById('deleteBtn').addEventListener('click', async function() {
            deleteMsg.classList.remove('show');

            const deviceId = getDeviceId();
            const accounts = await fetchAccounts();

            let foundUser = null;
            for (const key in accounts) {
                if (accounts[key].deviceId === deviceId) {
                    foundUser = key;
                    break;
                }
            }

            if (!foundUser) {
                showMsg(deleteMsg, '❌ Tidak ada akun yang terdaftar di device ini.', 'error');
                return;
            }

            if (!confirm(`⚠️ Yakin mau hapus akun "${foundUser}"? Aksi ini permanen!`)) {
                return;
            }

            delete accounts[foundUser];

            try {
                await updateGist(accounts);
                showMsg(deleteMsg, '✅ Akun berhasil dihapus!', 'success');
                setTimeout(() => {
                    deleteMsg.classList.remove('show');
                }, 3000);
            } catch (err) {
                showMsg(deleteMsg, '❌ Gagal menghapus akun: ' + err.message, 'error');
            }
        });

        // ============================================================
        // UTILITY
        // ============================================================
        function showMsg(el, text, type) {
            el.textContent = text;
            el.className = 'msg show ' + type;
        }

        // ============================================================
        // INIT - Seed default accounts kalo bin kosong
        // ============================================================
        (async function init() {
            try {
                const accounts = await fetchAccounts();
                if (Object.keys(accounts).length === 0) {
                    const defaultAccounts = {
                        'samil': {
                            password: 'samil123',
                            deviceId: 'DEV_DEFAULT',
                            role: 'Developer',
                            exp: '99,999',
                            createdAt: new Date().toISOString()
                        },
                        'admin': {
                            password: 'admin123',
                            deviceId: 'DEV_DEFAULT',
                            role: 'Administrator',
                            exp: '12,847',
                            createdAt: new Date().toISOString()
                        }
                    };
                    await updateGist(defaultAccounts);
                    console.log('✅ Default accounts created!');
                }
            } catch (e) {
                console.warn('Init gagal:', e);
            }
        })();
    </script>
</body>
    </html>
